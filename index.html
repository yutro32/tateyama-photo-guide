<style>

    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
  }

    max-width: 480px;

    box-shadow: 0 0 20px rgba(0,0,0,0.05);

  }

    font-size: 28px;

  }

    font-size: 18px;

    font-weight: normal;
  }

    font-size: 15px;
    color: #555;
    margin-bottom: 20px;
  }

  #home-screen {
    display: block;
    padding: 0 20px 40px;
  }

  .flag-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px 10px;
    font-size: 60px;
    line-height: 1;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

  .flag-btn:active {
    transform: scale(0.96);
    background: #f0f8ff;
  }

  .flag-label {
    font-size: 14px;
    color: #666;
    margin-top: 10px;
    font-weight: bold;
  }

  #player-screen {
    display: none;
    padding: 0 30px 40px;
  }

  .content-title {
    color: var(--primary-blue);
    font-size: 22px;
    text-align: center;
    margin-bottom: 30px;
    font-weight: bold;
  }

  .text-display {
    font-size: 15px;
    line-height: 1.8;
    color: #444;
    white-space: pre-line;
    margin-bottom: 35px;
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .action-btn {
    width: 100%;
    max-width: 300px;
    padding: 16px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    transition: opacity 0.2s;
  }

  .action-btn:active {
    opacity: 0.8;
  }

  .btn-play {
    background: var(--btn-blue);
    color: white;
    box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
  }

  .btn-stop {
    background: var(--btn-gray);
    color: white;
  }

  .btn-back {
    margin-top: 20px;
    background: none;
    border: none;
    color: var(--btn-blue);
    font-size: 16px;
    text-decoration: underline;
    cursor: pointer;
    padding: 10px;
  }
</style>
</head>

let currentIndex = 0;
let currentAudioObj = null; // MP3再生用オブジェクト

// --- 初期化 ---
window.onload = () => {
  const container = document.getElementById("flag-container");
  data.forEach((item, index) => {
    const btn = document.createElement("div");
    btn.className = "flag-btn";
    btn.onclick = () => selectLanguage(index);
    btn.innerHTML = `<div>${item.flag}</div><div class="flag-label">${item.name}</div>`;
    container.appendChild(btn);
  });
};

function selectLanguage(index) {
  currentIndex = index;
  const item = data[index];
  document.getElementById("home-screen").style.display = "none";
  document.getElementById("player-screen").style.display = "block";
  document.getElementById("player-title").innerText = item.name;
  document.getElementById("player-text").innerText = item.text;
}

function goBack() {
  stopAudio();
  document.getElementById("player-screen").style.display = "none";
  document.getElementById("home-screen").style.display = "block";
}

// --- 音声再生（MP3優先 ➔ なければ自動読み上げ） ---
function playAudio() {
  stopAudio(); 

  const item = data[currentIndex];

  // 1. MP3ファイルが指定されている場合は高音質MP3を再生
  if (item.audio) {
    currentAudioObj = new Audio(item.audio);
    currentAudioObj.play().catch(error => {
      console.warn("MP3の再生に失敗したため、ブラウザ読み上げに切り替えます:", error);
      playFallbackSpeech(item);
    });
  } else {
    // 2. MP3が無い場合は従来のブラウザ読み上げ
    playFallbackSpeech(item);
  }
}

// ブラウザ読み上げ（予備機能）
function playFallbackSpeech(item) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.resume();

  const fullText = item.speechText ? item.speechText : item.text;
  const smoothText = fullText.replace(/\n+/g, ' ');

  const utterance = new SpeechSynthesisUtterance(smoothText);
  utterance.lang = item.lang;
  utterance.rate = 0.98;

  window.speechSynthesis.speak(utterance);
}

function stopAudio() {
  // MP3停止
  if (currentAudioObj) {
    currentAudioObj.pause();
    currentAudioObj.currentTime = 0;
    currentAudioObj = null;
  }
  // ブラウザ読み上げ停止
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}
