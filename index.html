<head>
<meta charset="UTF-8">

<title>Photo Service Information</title>
<style>
  :root {
    --primary-blue: #0062b1;
    --btn-blue: #007aff;
    --btn-gray: #6c757d;
    --bg-color: #f8f9fa;
    --text-dark: #333;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-dark);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
  }

  .app-container {
    background: #ffffff;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
  }

  /* --- 共通ヘッダー --- */
  .header {
    text-align: center;
    padding: 40px 20px 20px;
  }

  .header h1 {
    color: var(--primary-blue);
    font-size: 28px;
    margin: 0 0 10px 0;
    line-height: 1.3;
  }

  .header h2 {
    color: var(--primary-blue);
    font-size: 18px;
    margin: 0 0 20px 0;
    font-weight: normal;
  }

  .instruction {
    text-align: center;
    font-size: 15px;
    color: #555;
    margin-bottom: 20px;
  }

  /* --- 画面1: 言語選択（国旗グリッド） --- */
  #home-screen {
    display: block;
    padding: 0 20px 40px;
  }

  .flag-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .flag-btn {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px 10px;
    font-size: 60px;
    line-height: 1;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .flag-btn:active {
    transform: scale(0.96);
    background: #f0f8ff;
  }

  .flag-label {
    font-size: 14px;
    color: #666;
    margin-top: 10px;
    font-weight: bold;
  }

  /* --- 画面2: 再生プレイヤー画面 --- */
  #player-screen {
    display: none;
    padding: 0 30px 40px;
  }

  .content-title {
    color: var(--primary-blue);
    font-size: 22px;
    text-align: center;
    margin-bottom: 30px;
    font-weight: bold;
  }

  .text-display {
    font-size: 15px;
    line-height: 1.8;
    color: #444;
    white-space: pre-line;
    margin-bottom: 35px;
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .action-btn {
    width: 100%;
    max-width: 300px;
    padding: 16px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    transition: opacity 0.2s;
  }

  .action-btn:active {
    opacity: 0.8;
  }

  .btn-play {
    background: var(--btn-blue);
    color: white;
    box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
  }

  .btn-stop {
    background: var(--btn-gray);
    color: white;
  }

  .btn-back {
    margin-top: 20px;
    background: none;
    border: none;
    color: var(--btn-blue);
    font-size: 16px;
    text-decoration: underline;
    cursor: pointer;
    padding: 10px;
  }

</style>
</head>

let currentIndex = 0;
let availableVoices = [];
let keepAliveTimer = null;

// --- 初期化処理 ---
window.onload = () => {
  const container = document.getElementById("flag-container");
  
  data.forEach((item, index) => {
    const btn = document.createElement("div");
    btn.className = "flag-btn";
    btn.onclick = () => selectLanguage(index);
    
    btn.innerHTML = `
      <div>${item.flag}</div>
      <div class="flag-label">${item.name}</div>
    `;
    container.appendChild(btn);
  });

  initVoices();
  
  // iOS Safari等でのタッチイベント解放（音声再生制限対策）
  document.body.addEventListener('touchstart', unlockAudio, { once: true });
  document.body.addEventListener('click', unlockAudio, { once: true });
};

function unlockAudio() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.resume();
  }
}

function initVoices() {
  if ('speechSynthesis' in window) {
    availableVoices = window.speechSynthesis.getVoices();
  }
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    initVoices();
  };
}

// --- 画面遷移 ---
function selectLanguage(index) {
  currentIndex = index;
  const item = data[index];
  
  document.getElementById("home-screen").style.display = "none";
  document.getElementById("player-screen").style.display = "block";
  
  document.getElementById("player-title").innerText = item.name;
  document.getElementById("player-text").innerText = item.text;
}

function goBack() {
  stopAudio();
  document.getElementById("player-screen").style.display = "none";
  document.getElementById("home-screen").style.display = "block";
}

// --- 音声検索（高音質優先エンジン） ---
function getBestVoice(lang) {
  if (!availableVoices || availableVoices.length === 0) {
    initVoices();
  }
  
  const targetPrefix = lang.split('-')[0];
  const langVoices = availableVoices.filter(v => v.lang === lang || v.lang.replace('_', '-').startsWith(targetPrefix));
  
  if (langVoices.length === 0) return null;

  // Premium, Enhanced, Google, Siri などクリアな声を優先検索
  const premium = langVoices.find(v => {
    const n = v.name.toLowerCase();
    return n.includes('premium') || n.includes('enhanced') || n.includes('google') || n.includes('siri') || n.includes('natural');
  });

  return premium || langVoices[0];
}

// --- 音声再生 ---
function playAudio() {
  stopAudio(); // 直前の再生処理とタイマーを完全に停止

  if (!('speechSynthesis' in window)) {
    alert("お使いのブラウザは音声読み上げに対応しておりません。");
    return;
  }

  const item = data[currentIndex];
  const textToSpeak = item.speechText ? item.speechText : item.text;
  
  const msg = new SpeechSynthesisUtterance(textToSpeak);
  msg.lang = item.lang;
  msg.rate = 0.95; // 聞き取りやすい標準速度
  msg.pitch = 1.0;
  msg.volume = 1.0;

  const bestVoice = getBestVoice(item.lang);
  if (bestVoice) {
    msg.voice = bestVoice;
  }

  // OS側のタイムアウト防止（15秒以上の長文再生で停止するバグ対策）
  msg.onstart = () => {
    clearInterval(keepAliveTimer);
    keepAliveTimer = setInterval(() => {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      } else {
        clearInterval(keepAliveTimer);
      }
    }, 10000);
  };

  msg.onend = () => clearInterval(keepAliveTimer);
  msg.onerror = () => clearInterval(keepAliveTimer);

  // iOS Safari向け安全実行
  window.speechSynthesis.resume();
  setTimeout(() => {
    window.speechSynthesis.speak(msg);
  }, 50);
}

function stopAudio() {
  if (keepAliveTimer) clearInterval(keepAliveTimer);
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}
