<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Service Information</title>
<style>
  :root {
    --primary-blue: #0062b1;
    --btn-blue: #007aff;
    --btn-gray: #6c757d;
    --bg-color: #f8f9fa;
    --text-dark: #333;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-dark);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
  }

  .app-container {
    background: #ffffff;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
  }

  /* --- 共通ヘッダー --- */
  .header {
    text-align: center;
    padding: 40px 20px 20px;
  }

  .header h1 {
    color: var(--primary-blue);
    font-size: 28px;
    margin: 0 0 10px 0;
    line-height: 1.3;
  }

  .header h2 {
    color: var(--primary-blue);
    font-size: 18px;
    margin: 0 0 20px 0;
    font-weight: normal;
  }

  .instruction {
    text-align: center;
    font-size: 15px;
    color: #555;
    margin-bottom: 20px;
  }

  /* --- 画面1: 言語選択（国旗グリッド） --- */
  #home-screen {
    display: block;
    padding: 0 20px 40px;
  }

  .flag-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .flag-btn {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px 10px;
    font-size: 60px; /* 国旗を大きく表示 */
    line-height: 1;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .flag-btn:active {
    transform: scale(0.96);
    background: #f0f8ff;
  }

  .flag-label {
    font-size: 14px;
    color: #666;
    margin-top: 10px;
    font-weight: bold;
  }

  /* --- 画面2: 再生プレイヤー画面 --- */
  #player-screen {
    display: none; /* 初期状態は非表示 */
    padding: 0 30px 40px;
  }

  .content-title {
    color: var(--primary-blue);
    font-size: 22px;
    text-align: center;
    margin-bottom: 30px;
    font-weight: bold;
  }

  .text-display {
    font-size: 16px;
    line-height: 1.8;
    color: #444;
    white-space: pre-line;
    margin-bottom: 40px;
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .action-btn {
    width: 100%;
    max-width: 300px;
    padding: 16px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    transition: opacity 0.2s;
  }

  .action-btn:active {
    opacity: 0.8;
  }

  .btn-play {
    background: var(--btn-blue);
    color: white;
    box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
  }

  .btn-stop {
    background: var(--btn-gray);
    color: white;
  }

  .btn-back {
    margin-top: 20px;
    background: none;
    border: none;
    color: var(--btn-blue);
    font-size: 16px;
    text-decoration: underline;
    cursor: pointer;
    padding: 10px;
  }

</style>
</head>
<body>

<div class="app-container">
  <!-- ホーム画面（国旗選択） -->
  <div id="home-screen">
    <div class="header">
      <h1>Photo Service<br>Information</h1>
      <h2>Multilingual Guide / 多言語案内</h2>
    </div>
    <div class="instruction">Select your language / 言語を選んでください</div>
    
    <div class="flag-grid" id="flag-container">
      <!-- JavaScriptで国旗ボタンを生成します -->
    </div>
  </div>

  <!-- プレイヤー画面（テキストと再生ボタン） -->
  <div id="player-screen">
    <div class="header" style="padding-bottom: 10px;">
      <h2 id="player-title" class="content-title">Title</h2>
    </div>
    
    <div id="player-text" class="text-display"></div>
    
    <div class="controls">
      <button class="action-btn btn-play" onclick="playAudio()">
        🔊 Listen (再生)
      </button>
      <button class="action-btn btn-stop" onclick="stopAudio()">
        ⏹ Stop (停止)
      </button>
      <button class="btn-back" onclick="goBack()">
        ← Back to language selection (戻る)
      </button>
    </div>
  </div>
</div>

<script>
// --- 音声・テキストデータ ---
const data = [
  {
    name: "English",
    flag: "🇺🇸",
    lang: "en-US",
    text:
`Welcome to the Tateyama Photo Experience!
At Murodo (elevation 2,450m), enjoy the breathtaking scenery of Mikurigaike Pond and majestic alpine views. You might even encounter the rare "Raicho" (Rock Ptarmigan), a sacred mountain bird known to bring good fortune!

Every group receives one complimentary L-size photo to commemorate your trip!

You may also purchase a premium Two L-size photo mounted on a special commemorative display card.

Price:
One Two L photo with display mount: 2,000 yen.

Enjoy your wonderful visit to Tateyama Murodo!`
  },
  {
    name: "繁體中文（台灣）",
    flag: "🇹🇼",
    lang: "zh-TW",
    text:
`歡迎來到立山拍照體驗！
在海拔2,450公尺的立山室堂，您可以欣賞御庫裏池與壯麗的高山絕景，還有機會遇見象徵幸運的特別天然紀念物——「雷鳥」！

為紀念您的旅程，每組旅客皆可免費獲得一張專屬合照的 L 尺寸照片！

另外，您也可以自由加購附精美紀念台紙的 Two L 尺寸照片。

價格：
附台紙 Two L 照片
每張 2,000 日圓。

祝您在立山室堂留下最美好的回憶！`
  },
  {
    name: "繁體中文（香港）",
    flag: "🇭🇰",
    lang: "zh-HK",
    text:
`歡迎嚟到立山影相體驗！
喺海拔2,450米嘅立山室堂，您可以欣賞御庫裏池與壯麗嘅高山絕景，仲有機會遇到象徵幸運嘅特別天然紀念物「雷鳥」添！

為咗紀念您嘅旅程，每組旅客都可以免費獲贈一張專屬合照嘅 L 尺寸相片！

另外，您亦可以自由加購附送精美紀念台紙嘅 Two L 尺寸相片。

價錢：
附台紙 Two L 相片
每張 2,000 日圓。

祝您喺立山室堂玩得開心，留低美好嘅回憶！`
  },
  {
    name: "简体中文",
    flag: "🇨🇳",
    lang: "zh-CN",
    text:
`欢迎体验立山摄影服务！
在海拔2450米的立山室堂，您可以欣赏御库里池与壮丽的高山绝景，还有机会偶遇象征幸运的特别天然纪念物——“雷鸟”！

为纪念您的旅程，每组游客均可免费获得一张专属合影的 L 尺寸照片！

另外，您还可以自由购买带精美纪念卡纸的 Two L 尺寸照片。

价格：
带卡纸 Two L 照片
每张 2000 日元。

祝您在立山室堂旅途愉快！`
  },
  {
    name: "한국어",
    flag: "🇰🇷",
    lang: "ko-KR",
    text:
`다테야마 포토 체험에 오신 것을 환영합니다!
해발 2,450m에 위치한 다테야마 무로도에서는 아름다운 미쿠리가이케 못과 장엄한 고산 절경은 물론, 행운을 가져다주는 천연기념물 '라이초(뇌조)' 새도 만나보실 수 있습니다!

여행을 기념하여 한 그룹당 고객님의 사진이 포함된 L사이즈 사진 한 장을 무료로 드립니다!

또한 전용 기념 받침대가 포함된 2L 사진도 자유롭게 구매하실 수 있습니다.

가격:
받침대 포함 2L 사진 1장 2,000엔

다테야마 무로도에서 즐거운 추억을 만들어 보세요!`
  },
  {
    name: "ภาษาไทย",
    flag: "🇹🇭",
    lang: "th-TH",
    text:
`ยินดีต้อนรับสู่บริการถ่ายภาพที่ทาเทยามะ!
ณ มุโรโดะที่ความสูง 2,450 เมตร คุณจะได้สัมผัสทัศนียภาพอันงดงามของบ่อมิคุริไกเคะ ทิวทัศน์ภูเขาอันยิ่งใหญ่ และอาจได้พบกับ "นกไรโช" นกภูเขาศักดิ์สิทธิ์ที่เป็นสัญลักษณ์แห่งโชคดี!

เพื่อเป็นที่ระลึกในการเดินทาง ลูกค้าหนึ่งกลุ่มจะได้รับรูปถ่ายขนาด L ที่มีรูปของท่านฟรีหนึ่งใบ!

นอกจากนี้ยังสามารถเลือกซื้อรูปขนาด 2L พร้อมฐานตั้งที่ระลึกได้ตามต้องการ

ราคา:
2,000 เยนต่อใบ (พร้อมฐานตั้ง)

ขอให้ทุกท่านเที่ยวทาเทยามะมุโรโดะอย่างมีความสุข!`
  },
  {
    name: "Bahasa Indonesia",
    flag: "🇮🇩",
    lang: "id-ID",
    text:
`Selamat datang di Pengalaman Foto Tateyama!
Di Murodo (ketinggian 2.450 m), Anda dapat menikmati pemandangan Kolam Mikurigaike, keindahan pegunungan, dan mungkin berkesempatan bertemu burung langka "Raicho" yang membawa keberuntungan!

Sebagai kenang-kenangan, setiap kelompok akan menerima satu foto ukuran L secara gratis!

Anda juga dapat membeli foto ukuran 2L dengan dudukan lipat kenang-kenangan.

Harga:
Satu foto 2L dengan dudukan: 2.000 yen.

Selamat menikmati kunjungan Anda di Tateyama Murodo!`
  }
];

let currentIndex = 0;

// --- 初期化処理 ---
window.onload = () => {
  const container = document.getElementById("flag-container");
  
  data.forEach((item, index) => {
    const btn = document.createElement("div");
    btn.className = "flag-btn";
    btn.onclick = () => selectLanguage(index);
    
    btn.innerHTML = `
      <div>${item.flag}</div>
      <div class="flag-label">${item.name}</div>
    `;
    container.appendChild(btn);
  });
};

// --- 画面遷移と音声制御 ---
function selectLanguage(index) {
  currentIndex = index;
  const item = data[index];
  
  // UIの切り替え
  document.getElementById("home-screen").style.display = "none";
  document.getElementById("player-screen").style.display = "block";
  
  // テキストのセット
  document.getElementById("player-title").innerText = item.name;
  document.getElementById("player-text").innerText = item.text;

  // 選択後、自動で音声を再生させる場合は以下のコメントアウトを外してください
  // playAudio();
}

function goBack() {
  stopAudio();
  document.getElementById("player-screen").style.display = "none";
  document.getElementById("home-screen").style.display = "block";
}

function playAudio() {
  speechSynthesis.cancel();
  const item = data[currentIndex];
  const msg = new SpeechSynthesisUtterance(item.text);
  
  msg.lang = item.lang;
  msg.rate = 0.95;
  msg.pitch = 1;
  msg.volume = 1;

  const voices = speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang === item.lang || v.lang.startsWith(item.lang.split('-')[0]));
  if (voice) {
    msg.voice = voice;
  }

  speechSynthesis.speak(msg);
}

function stopAudio() {
  speechSynthesis.cancel();
}

// OSの音声エンジン読み込み対策
speechSynthesis.onvoiceschanged = function() {};
</script>

</body>
</html>
